<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MikeVideo</title>
<meta name="theme-color" content="#0f0f11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23FF8A5B'/%3E%3Cstop offset='.5' stop-color='%23FF6FA5'/%3E%3Cstop offset='1' stop-color='%237C7CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%23131017'/%3E%3Cpath d='M13 11l9 5-9 5z' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f0f11; --bg2:#17171b; --elev:#1d1d22; --hover:#26262d; --line:#2a2a31;
    --ink:#f6f4f2; --muted:#a5a1ad; --faint:#78727f;
    --coral:#FF8A5B; --rose:#FF6FA5; --peri:#7C7CFF;
    --ok:#54d18c; --warn:#ffcf5c; --err:#ff6b6b;
    --grad:linear-gradient(100deg,var(--coral),var(--rose) 46%,var(--peri) 92%);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,"Helvetica Neue",Arial,sans-serif;
    --hdr-h:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.4;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-thumb{background:#33333c;border-radius:8px;border:3px solid var(--bg)}
  img{display:block}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:40;height:var(--hdr-h);display:flex;align-items:center;
    gap:16px;padding:0 16px;background:rgba(15,15,17,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;flex:none}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--grad);display:grid;place-items:center;
    color:#fff;font-size:13px;box-shadow:0 6px 18px -7px rgba(255,111,165,.7)}
  .brand .gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .search{flex:1;max-width:600px;margin:0 auto;display:flex;align-items:center}
  .search form{display:flex;width:100%;align-items:stretch}
  .search input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-right:none;
    border-radius:20px 0 0 20px;padding:9px 16px;font-size:14.5px;outline:none}
  .search input:focus{border-color:var(--peri)}
  .search input::placeholder{color:var(--faint)}
  .search .go{background:var(--elev);border:1px solid var(--line);border-radius:0 20px 20px 0;
    width:58px;display:grid;place-items:center;font-size:16px;color:var(--muted)}
  .search .go:hover{background:var(--hover)}
  .hactions{display:flex;align-items:center;gap:10px;flex:none}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:8px 15px;font-weight:600;font-size:13.5px}
  .btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px -12px rgba(255,111,165,.7)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:var(--elev);border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{background:var(--hover);border-color:#3a3a44}
  .keydot{width:34px;height:34px;border-radius:50%;background:var(--elev);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);position:relative}
  .keydot.on{background:var(--grad);color:#fff;border:none}
  .keydot .ind{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
    background:#5a5560;border:2px solid var(--bg)}
  .keydot.on .ind{background:var(--ok)}

  /* ---------- layout ---------- */
  main{max-width:1600px;margin:0 auto;padding:22px 24px 80px}
  .hide{display:none!important}

  /* ---------- left rail (P4) — YouTube-style mini guide ---------- */
  #rail{position:fixed;left:0;top:var(--hdr-h);bottom:0;width:78px;z-index:30;
    display:flex;flex-direction:column;gap:4px;padding:10px 6px;background:var(--bg);
    border-right:1px solid var(--line)}
  #rail a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;
    border-radius:12px;color:var(--muted);font-size:10.5px;font-weight:600}
  #rail a .ic{font-size:20px;line-height:1}
  #rail a:hover{background:var(--elev);color:var(--ink)}
  #rail a.on{background:var(--elev);color:var(--ink)}
  @media(min-width:1000px){ main{padding-left:94px} }
  @media(max-width:999px){ #rail{display:none} }

  /* ---------- video grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px 16px}
  .card{cursor:pointer;display:flex;flex-direction:column}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;
    display:grid;place-items:center}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb.contain img{object-fit:contain}
  .thumb .ph{color:#3d3d46;font-size:34px}
  .card:hover .thumb{border-radius:6px}
  .thumb{transition:border-radius .12s}
  .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;
    font-weight:600;padding:1px 6px;border-radius:5px;letter-spacing:.02em}
  .vis{position:absolute;left:6px;top:6px;display:inline-flex;align-items:center;gap:4px;font-size:11px;
    font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.7);color:#fff}
  .vis.public{background:rgba(84,209,140,.9);color:#04120a}
  .statepill{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:capitalize}
  .statepill.encoding{background:rgba(255,207,92,.9);color:#211800}
  .statepill.uploading{background:rgba(255,138,91,.9);color:#210b00}
  .statepill.failed{background:rgba(255,107,107,.92);color:#210000}
  .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28)}
  .pbar>i{display:block;height:100%;background:var(--rose)}
  .cmeta{display:flex;gap:11px;margin-top:11px}
  .cmeta .av{width:34px;height:34px;border-radius:50%;background:var(--grad);flex:none;margin-top:1px}
  .ctitle{font-size:14.5px;font-weight:600;line-height:1.3;max-height:2.6em;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .csub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .csub .cc{color:var(--faint)}
  .creason{color:var(--peri);font-size:11.5px;font-weight:600;margin-top:4px;display:inline-flex;align-items:center;gap:4px}
  .creason::before{content:"✦"}

  .sectitle{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 16px;letter-spacing:.01em}
  .empty{color:var(--muted);text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:16px;background:var(--bg2)}
  .empty b{color:var(--ink)}
  .filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .chip{background:var(--elev);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink)}
  .chip.on{background:var(--ink);color:#111;border-color:var(--ink)}

  /* ---------- watch ---------- */
  .watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
  @media(max-width:1100px){ .watch{grid-template-columns:1fr} }
  .player{width:100%;background:#000;border-radius:14px;overflow:hidden;display:grid;place-items:center;max-height:82vh}
  .player video{width:100%;height:auto;max-height:82vh;background:#000;display:block}
  .player video::cue{background:rgba(0,0,0,.7);font-size:.85em}
  h1.wt{font-size:20px;font-weight:700;line-height:1.3;margin:18px 0 10px}
  .wactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .wactions .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--elev);border:1px solid var(--line);
    border-radius:20px;padding:8px 15px;font-weight:600;font-size:13.5px}
  .pill:hover{background:var(--hover)}
  .pill.on{background:var(--grad);color:#fff;border:none}
  .desc{margin-top:16px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .desc .dmeta{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .desc .sum{font-size:14px;line-height:1.55;white-space:pre-wrap}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tag{font-size:12.5px;color:var(--peri);background:rgba(124,124,255,.13);border:1px solid rgba(124,124,255,.3);
    padding:4px 11px;border-radius:20px}
  .chapters{margin-top:14px}
  .chapters h4,.tr h4{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
  .chap{display:flex;gap:12px;align-items:baseline;padding:7px 8px;border-radius:8px;cursor:pointer}
  .chap:hover{background:var(--hover)}
  .chap .t{color:var(--rose);font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;font-size:13px}
  .tr{margin-top:16px}
  .tr .seg{padding:6px 8px;border-radius:7px;cursor:pointer;display:flex;gap:12px}
  .tr .seg:hover{background:var(--hover)}
  .tr .seg .t{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:48px}
  .tr .seg .x{color:var(--muted);font-size:13.5px;line-height:1.5}
  details.box{margin-top:16px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 16px}
  details.box>summary{padding:14px 0;font-weight:700;cursor:pointer;list-style:none;color:var(--ink)}
  details.box[open]{padding-bottom:14px}

  .uphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .apnext{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
  .apnext input{position:absolute;opacity:0;width:0;height:0}
  .apnext .track{width:38px;height:22px;border-radius:12px;background:var(--elev);border:1px solid var(--line);position:relative;transition:.18s}
  .apnext .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.18s}
  .apnext input:checked+.track{background:var(--grad);border-color:transparent}
  .apnext input:checked+.track::after{transform:translateX(16px);background:#fff}
  .up .uprow{display:flex;gap:10px;margin-bottom:12px;cursor:pointer;border-radius:10px;padding:4px}
  .up .uprow:hover{background:var(--bg2)}
  .up .upt{width:168px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#000;flex:none;position:relative;display:grid;place-items:center}
  .up .upt img{width:100%;height:100%;object-fit:cover}
  .up .upmeta{min-width:0;padding-top:2px}
  .up .upname{font-size:14px;font-weight:600;line-height:1.3;max-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .up .upsub{color:var(--muted);font-size:12.5px;margin-top:4px}

  /* ---------- search results ---------- */
  .results{display:flex;flex-direction:column;gap:14px;max-width:1000px}
  .res{display:flex;gap:16px;cursor:pointer;border-radius:12px;padding:8px}
  .res:hover{background:var(--bg2)}
  .res .rt{width:260px;aspect-ratio:16/9;border-radius:11px;overflow:hidden;background:#000;flex:none;position:relative;display:grid;place-items:center}
  .res .rt img{width:100%;height:100%;object-fit:cover}
  .res .rtitle{font-size:17px;font-weight:600}
  .res .rsnip{color:var(--muted);font-size:13.5px;margin-top:8px;line-height:1.5}
  .res .rstamp{color:var(--rose);font-weight:700}
  @media(max-width:640px){ .res .rt{width:150px} }

  /* ---------- modals ---------- */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;padding:20px}
  .sheet{background:var(--elev);border:1px solid var(--line);border-radius:18px;width:100%;max-width:520px;padding:22px 22px 24px;box-shadow:0 40px 90px -30px #000}
  .sheet h3{margin:0 0 4px;font-size:18px}
  .sheet p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
  .sheet .row{display:flex;gap:10px}
  .sheet input[type=password],.sheet input[type=text],.sheet input[type=email]{width:100%;background:var(--bg2);
    border:1px solid var(--line);border-radius:11px;padding:11px 14px;outline:none;font-size:14px}
  .sheet input:focus{border-color:var(--peri)}
  .sheet label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 6px}
  .sheet label input,.sheet label textarea{width:100%;background:var(--bg2);border:1px solid var(--line);
    border-radius:11px;padding:11px 14px;outline:none;font-size:14px;color:var(--ink);font-family:inherit;resize:vertical}
  .sheet label input:focus,.sheet label textarea:focus{border-color:var(--peri)}
  .sheet .row{justify-content:flex-end;margin-top:18px}
  .sheet .err{color:var(--err);font-size:13px;margin-top:10px;min-height:1em}

  /* ---------- channel avatars + byline ---------- */
  .av.letter{display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
  .cchan{color:var(--muted);font-size:12.5px;margin-top:3px;font-weight:600;cursor:pointer}
  .cchan:hover{color:var(--ink)}
  .wchan{display:flex;align-items:center;gap:11px;margin:6px 0 14px;cursor:pointer;width:max-content}
  .wchan .av{width:42px;height:42px;border-radius:50%;background:var(--grad);flex:none}
  .wchan .av.letter{font-size:18px}
  .wcname{font-weight:700;font-size:15px}
  .wchandle{color:var(--muted);font-size:12.5px;margin-top:1px}
  .chbanner{display:flex;align-items:center;gap:20px;margin:6px 0 28px;flex-wrap:wrap}
  .chav{width:96px;height:96px;border-radius:50%;background:var(--grad);flex:none}
  .chav.letter{font-size:40px}
  .chinfo{min-width:0;flex:1}
  h1.chname{font-size:26px;font-weight:800;margin:0 0 6px}
  .chsub{color:var(--muted);font-size:14px;font-weight:600}
  .chbio{color:var(--ink);font-size:14px;margin-top:10px;max-width:70ch;white-space:pre-wrap;line-height:1.5}
  .chact{display:flex;gap:10px;flex-wrap:wrap}
  .subbtn{background:var(--ink);color:#111;border-radius:20px;padding:9px 17px;font-weight:700;font-size:13.5px;white-space:nowrap}
  .subbtn.on{background:var(--elev);color:var(--muted);border:1px solid var(--line)}
  .wchanrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
  .wchanrow .wchan{margin:0}

  /* ---------- comments (P5) ---------- */
  .comments{margin-top:26px}
  .cmhead{font-size:16px;font-weight:700;margin-bottom:16px}
  .cmprow{display:flex;gap:12px;margin-bottom:22px}
  .cmpin{flex:1;display:flex;gap:10px;align-items:center}
  .cmpin input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--line);
    padding:8px 2px;outline:none;font-size:14px;color:var(--ink)}
  .cmpin input:focus{border-bottom-color:var(--ink)}
  .cmt{display:flex;gap:12px;margin-bottom:18px}
  .cmt .av{width:38px;height:38px;flex:none;cursor:pointer}
  .cmbody{min-width:0;flex:1}
  .cmmeta{display:flex;align-items:center;gap:8px}
  .cmname{font-size:13px;font-weight:600;cursor:pointer}
  .cmname:hover{color:var(--muted)}
  .cmago{color:var(--muted);font-size:12px}
  .cheart{color:var(--rose);font-size:12px}
  .cmtext{font-size:14px;margin:3px 0 6px;white-space:pre-wrap;word-break:break-word}
  .cmbar{display:flex;align-items:center;gap:6px}
  .cmaction{color:var(--muted);font-size:12.5px;font-weight:600;border-radius:16px;padding:5px 9px}
  .cmaction:hover{background:var(--elev);color:var(--ink)}
  .cmaction.on{color:var(--ink)}
  .creplies{margin-top:12px;padding-left:4px;border-left:2px solid var(--line)}
  .creplies .cmt{margin-left:8px}
  .creplies .av{width:30px;height:30px}
  @media(max-width:640px){ .chav{width:72px;height:72px} .chav.letter{font-size:30px} h1.chname{font-size:21px} }
  .drop{border:1.5px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);
    background:var(--bg2);cursor:pointer;transition:.15s}
  .drop:hover,.drop.hot{border-color:var(--rose);color:var(--ink);background:rgba(255,111,165,.06)}
  .drop .ic{width:52px;height:52px;border-radius:15px;background:var(--grad);margin:0 auto 14px;display:grid;place-items:center;font-size:24px;color:#fff}
  .drop .big{font-size:17px;color:var(--ink);font-weight:600;margin-bottom:5px}
  .close{position:absolute;top:14px;right:16px;font-size:22px;color:var(--muted);line-height:1}
  #uplist{margin-top:14px;display:flex;flex-direction:column;gap:10px;max-height:40vh;overflow:auto}
  .up-item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .up-item b{font-weight:600;font-size:13.5px}
  .bar{height:7px;background:#0c0c0e;border-radius:5px;overflow:hidden;margin-top:9px}
  .bar>i{display:block;height:100%;width:0;background:var(--grad);transition:width .25s}
  .hint{color:var(--muted);font-size:12.5px}

  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;
    background:var(--ink);color:#111;font-weight:600;font-size:13.5px;padding:11px 18px;border-radius:11px;
    box-shadow:0 20px 50px -18px #000;transition:.22s;pointer-events:none}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:640px){
    header{gap:8px;padding:0 10px}
    .brand span.gt,.brand span.w{display:none}
    main{padding:16px 12px 70px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px 10px}
    .btn.primary .w{display:none}
    h1.wt{font-size:17px}
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/" onclick="go('')">
    <span class="mark">▶</span><span class="w">Mike</span><span class="gt">Video</span>
  </a>
  <div class="search">
    <form onsubmit="return doSearch(event)">
      <input id="q" type="search" placeholder="Search what was said…" autocomplete="off">
      <button class="go" type="submit" aria-label="Search">⌕</button>
    </form>
  </div>
  <div class="hactions">
    <button class="btn ghost hsub hide" onclick="go('subs')" title="Subscriptions">📺<span class="w"> Subscriptions</span></button>
    <button class="btn ghost" onclick="go('playlists')" title="Playlists">☰<span class="w"> Playlists</span></button>
    <button class="btn primary" onclick="openUpload()">↑ <span class="w">Upload</span></button>
    <span id="account"></span>
  </div>
</header>

<nav id="rail">
  <a data-rail="home" onclick="go('')"><span class="ic">🏠</span>Home</a>
  <a data-rail="subs" onclick="go('subs')"><span class="ic">📺</span>Subs</a>
  <a data-rail="playlists" onclick="go('playlists')"><span class="ic">☰</span>Library</a>
</nav>

<main id="view"></main>

<div id="toast"></div>

<script src="/hls.js"></script>
<script>
const CHUNK = 4 * 1024 * 1024;
let TOKEN = localStorage.getItem('mikevideo_token') || '';
let REFRESH = localStorage.getItem('mikevideo_refresh') || '';
let USER = JSON.parse(localStorage.getItem('mikevideo_user') || 'null');
// "Sign in with MikeOS" — OAuth 2.0 Authorization Code + PKCE (ecosystem/AUTHENTICATION.md ROLE 3).
const OAUTH = { issuer:'https://account.osmike.com', client:'mikevideo-web',
  redirect: location.origin+'/auth/callback', scope:'openid email video.read video.write' };
let LIB = [];                 // cached owner library

const $ = s => document.querySelector(s);
const view = $('#view');
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hdr(x){ const h=Object.assign({},x||{}); if(TOKEN) h['Authorization']='Bearer '+TOKEN; return h; }
function fmtDur(s){ if(!s) return ''; s=Math.round(s); const h=(s/3600)|0,m=((s%3600)/60)|0,ss=('0'+(s%60)).slice(-2);
  return h? h+':'+('0'+m).slice(-2)+':'+ss : m+':'+ss; }
function fmtBytes(b){ if(!b) return ''; const u=['B','KB','MB','GB','TB'];let i=0;b=+b;
  while(b>=1024&&i<u.length-1){b/=1024;i++;} return (b>=100||i===0?Math.round(b):b.toFixed(1))+' '+u[i]; }
function ago(iso){ if(!iso) return ''; const d=(Date.now()-new Date(iso).getTime())/1000;
  const u=[[31536000,'year'],[2592000,'month'],[604800,'week'],[86400,'day'],[3600,'hour'],[60,'minute']];
  for(const [s,n] of u){ if(d>=s){ const v=Math.floor(d/s); return v+' '+n+(v>1?'s':'')+' ago'; } } return 'just now'; }
function dims(v){ const w=v.display_width||v.width,h=v.display_height||v.height; return (w&&h)?w+'×'+h:''; }
function fmtDate(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }
// Prefer the AI title; otherwise a friendly date — never a raw filename.
function titleOf(v){ return v.ai_title || (v.created_at ? ('Clip · '+fmtDate(v.created_at)) : (v.filename||'Untitled')); }
function ccLang(v){ return (v.transcript_status==='ready' && v.spoken_language) ? v.spoken_language.toUpperCase() : ''; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
function renderAccount(){
  const a=$('#account'); if(!a) return;

  if(TOKEN){

  } else {

}

}
function signOut(){ TOKEN=''; REFRESH=''; USER=null; MYCH=null;

/* ---------------- router ---------------- */
function go(hash){ location.hash = hash; }
function parseHash(){
  const h = location.hash.replace(/^#/,'');
  if(h.startsWith('watch=')) return {v:'watch', id:decodeURIComponent(h.slice(6))};
  if(h.startsWith('search=')) return {v:'search', q:decodeURIComponent(h.slice(7))};
  if(h.startsWith('playlist=')) return {v:'playlist', id:decodeURIComponent(h.slice(9))};
  if(h.startsWith('channel=')) return {v:'channel', handle:decodeURIComponent(h.slice(8))};
  if(h==='playlists') return {v:'playlists'};
  if(h==='subs') return {v:'subs'};
  return {v:'home'};
}
function markRail(v){
  const map={home:'home',subs:'subs',playlists:'playlists',playlist:'playlists'};
  document.querySelectorAll('#rail a').forEach(a=>a.classList.toggle('on', a.dataset.rail===map[v]));
}
async function route(){
  const r = parseHash();
  markRail(r.v);
  if(r.v==='watch') return renderWatch(r.id);
  if(r.v==='search'){ $('#q').value=r.q; return renderSearch(r.q); }
  if(r.v==='playlists') return renderPlaylists();
  if(r.v==='playlist') return renderPlaylistDetail(r.id);
  if(r.v==='channel') return renderChannel(r.handle);
  if(r.v==='subs') return renderSubs();
  return renderHome();
}
window.addEventListener('hashchange', route);

/* ---------------- home ---------------- */
async function loadLibrary(){
  if(!TOKEN) return [];
  try{ const r=await afetch('/api/videos'); if(!r.ok) return []; LIB=(await r.json()).videos||[]; return LIB; }
  catch(e){ return []; }
}
function fmtCount(n){ n=+n||0; if(n<1000) return ''+n; if(n<1e6) return (n/1e3).toFixed(n<1e4?1:0).replace(/\.0$/,'')+'K'; return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; }
function fmtViews(n){ n=+n||0; return n>0 ? fmtCount(n)+(n===1?' view · ':' views · ') : ''; }
function wireEngagement(v, video){
  try{ fetch('/api/videos/'+v.id+'/view',{method:'POST'}); }catch(e){}   // count a view
  if(v.progress_sec && v.progress_sec>5){                                  // resume
    const doSeek=()=>{ try{ if(video.currentTime<1) video.currentTime=v.progress_sec; }catch(e){} };
    video.addEventListener('loadedmetadata',doSeek,{once:true}); video.addEventListener('canplay',doSeek,{once:true});
  }
  if(TOKEN){ let last=0;                                                    // save progress
    const save=()=>{ const pos=video.currentTime||0; if(pos<1) return; last=Date.now();
      try{ fetch('/api/videos/'+v.id+'/progress',{method:'PUT',headers:hdr({'Content-Type':'application/json'}),
        body:JSON.stringify({position_sec:pos,duration_sec:video.duration||v.duration_sec||null})}); }catch(e){} };
    video.addEventListener('timeupdate',()=>{ if(Date.now()-last>5000) save(); });
    video.addEventListener('pause',save); window.addEventListener('beforeunload',save);
  }
}
async function toggleLike(id){
  if(!TOKEN){ startOAuth(); return; }
  const btn=$('#likebtn'); if(!btn) return; const liked=btn.classList.contains('on');
  try{ const r=await afetch('/api/videos/'+id+'/like',{method:liked?'DELETE':'POST'});
    const d=await r.json(); if(r.ok){ btn.classList.toggle('on', d.liked); const c=$('#likecount'); if(c) c.textContent=fmtCount(d.likes); } }catch(e){}
}
function videoCard(v){
  const ready = v.status==='ready';
  const state = ready ? '' : `<span class="statepill ${v.status}">${v.status}</span>`;
  const vis = ready ? `<span class="vis ${v.visibility}">${v.visibility==='public'?'🌐 Public':'🔒 Private'}</span>` : '';
  const dur = v.duration_sec? `<span class="dur">${fmtDur(v.duration_sec)}</span>`:'';
  const contain = v.orientation==='portrait' ? 'contain':'';
  const img = v.thumb_url? `<img class="" src="${v.thumb_url}" loading="lazy">` : '<span class="ph">▶</span>';
  const cc = ccLang(v)? `<span class="cc"> · CC ${ccLang(v)}</span>`:'';
  const pbar = (v.progress_sec&&v.duration_sec)? `<div class="pbar"><i style="width:${Math.min(100,v.progress_sec/v.duration_sec*100)}%"></i></div>`:'';
  const ch = v.channel;
  const av = ch ? avatarEl(ch, 'av') : `<div class="av"></div>`;
  const chLine = ch ? `<div class="cchan" onclick="event.stopPropagation();go('channel=${esc(ch.handle)}')">${esc(ch.display_name)}</div>` : '';
  const reason = v.reason ? `<div class="creason">${esc(v.reason)}</div>` : '';
  return `<div class="card" onclick="${ready?`go('watch=${v.id}')`:''}">
    <div class="thumb ${contain}">${img}${vis||state}${dur}${pbar}</div>
    <div class="cmeta">${av}<div>
      <div class="ctitle">${esc(titleOf(v))}</div>
      ${chLine}
      <div class="csub">${fmtViews(v.view_count)}${ago(v.created_at)}${cc}</div>
      ${reason}
    </div></div></div>`;
}
// A channel avatar: image if set, else the first letter on the brand gradient.
function avatarEl(ch, cls){
  const name=(ch.display_name||ch.handle||'?');
  if(ch.avatar_url) return `<div class="${cls}" style="background-image:url('${esc(ch.avatar_url)}');background-size:cover"></div>`;
  return `<div class="${cls} letter">${esc(name[0].toUpperCase())}</div>`;
}
async function renderHome(){
  if(!TOKEN){
    // Anonymous → the PUBLIC gallery (like a YouTube home). No login required.
    view.innerHTML = `<div class="sectitle">Public on MikeVideo</div><div id="grid" class="grid"></div>`;
    let vids=[];
    try{ const r=await fetch('/api/public/videos'); vids=(await r.json()).videos||[]; }catch(e){}
    const g=$('#grid');
    if(!vids.length){ g.innerHTML=`<div class="empty" style="grid-column:1/-1;margin-top:6vh">
      <div style="font-size:44px;margin-bottom:14px">▶</div>
      <div style="font-size:20px;font-weight:700">Nothing public yet</div>
      <p style="max-width:44ch;margin:10px auto 18px;color:var(--muted)">Sign in to see your own library and upload — or open a shared link to watch.</p>
      <button class="btn primary" onclick="startOAuth()" style="display:inline-flex">Sign in with MikeOS</button></div>`; return; }
    g.innerHTML = vids.map(videoCard).join('');

  }
  // Signed-in home: a personalized "Recommended" feed (P6), with a "Your videos"
  // tab for the owner's own library, and a Continue-watching row on top.
  view.innerHTML = `<div id="continue"></div>
    <div class="filters"><button class="chip on" data-h="reco" onclick="setHome('reco')">Recommended</button>
    <button class="chip" data-h="mine" onclick="setHome('mine')">Your videos</button></div>
    <div id="grid" class="grid"></div>`;
  loadLibrary();                 // warm LIB (used by up-next + the "Your videos" tab)
  setHome('reco');
  try{ const r=await afetch('/api/me/continue'); const cw=((await r.json()).videos)||[];
    if(cw.length){ $('#continue').innerHTML=`<div class="sectitle">Continue watching</div>
      <div class="grid" style="margin-bottom:28px">${cw.map(videoCard).join('')}</div>`; } }catch(e){}

let _home='reco';
async function setHome(mode){
  _home=mode;
  document.querySelectorAll('.chip[data-h]').forEach(c=>c.classList.toggle('on',c.dataset.h===mode));
  const g=$('#grid'); if(!g) return;
  if(mode==='mine'){                                     // the owner's own library
    const vids = LIB.length ? LIB : await loadLibrary();
    g.innerHTML = vids.length ? vids.map(videoCard).join('')
      : `<div class="empty" style="grid-column:1/-1">No videos yet. Hit <b>Upload</b> to add one.</div>`;
    return;
  }
  g.innerHTML = `<div class="empty" style="grid-column:1/-1;border:none;background:none">Loading recommendations…</div>`;
  let vids=[];
  try{ const r=await afetch('/api/feed/home'); if(r.ok) vids=((await r.json()).videos)||[]; }catch(e){}
  if(!vids.length){ try{ const r=await fetch('/api/public/videos'); vids=((await r.json()).videos)||[]; }catch(e){} }
  if(g!==$('#grid') || _home!=='reco') return;           // user switched tabs while loading
  g.innerHTML = vids.length ? vids.map(videoCard).join('')
    : `<div class="empty" style="grid-column:1/-1">Nothing to recommend yet — subscribe to a creator or make a video public.</div>`;
}

/* ---------------- watch ---------------- */
let hls=null;
async function fetchVideo(id){
  // Owner first (if connected), else the public endpoint (shared links).
  if(TOKEN){
    const r=await afetch('/api/videos/'+id);
    if(r.ok) return await r.json();
  }
  const p=await fetch('/api/public/videos/'+id);
  if(p.ok) return await p.json();
  return null;
}
async function renderWatch(id){
  view.innerHTML = `<div class="watch"><div><div class="player" id="player"></div><div id="winfo"></div></div>
    <div class="up" id="upnext"></div></div>`;
  const v = await fetchVideo(id);
  if(!v){ view.innerHTML=`<div class="empty" style="margin-top:8vh"><b>Video not available.</b><p style="color:var(--muted);margin-top:8px">It may be private, or the link is wrong.</p><button class="btn ghost" onclick="go('')" style="display:inline-flex;margin-top:6px">Go home</button></div>`; return; }
  mountPlayer(v);
  renderWatchInfo(v);
  renderUpNext(v);
  if(v.ai_tags) { /* keep */ }
}
function mountPlayer(v){
  const p=$('#player'); p.innerHTML='';
  const video=document.createElement('video'); video.controls=true; video.autoplay=true; video.playsInline=true; video.crossOrigin='anonymous';
  if(v.display_width&&v.display_height){ video.style.aspectRatio=v.display_width+' / '+v.display_height;
    if(v.orientation==='portrait') video.style.width='auto'; }
  if(v.thumb_url) video.poster=v.thumb_url;
  if(v.captions_url){ const t=document.createElement('track'); t.kind='subtitles'; t.src=v.captions_url; t.default=true;
    t.srclang=v.spoken_language||'und'; t.label=(v.spoken_language||'CC').toUpperCase(); video.appendChild(t); }
  p.appendChild(video);
  if(hls){hls.destroy();hls=null;}
  // Known-good player: native HLS on Safari, hls.js on Chrome/Firefox, MP4 otherwise.
  // (Reverted the autoplay/watchdog/MP4-swap experiment — it regressed real playback.)
  if(video.canPlayType('application/vnd.apple.mpegurl')) video.src=v.hls_url;
  else if(window.Hls && Hls.isSupported()){ hls=new Hls({maxBufferLength:24}); hls.loadSource(v.hls_url); hls.attachMedia(video); }
  else video.src=v.mp4_url;
  window._video=video;
  wireEngagement(v, video);   // count view · resume · save progress
}
function seekTo(sec){ if(window._video){ try{ window._video.currentTime=sec; window._video.play(); }catch(e){} } }
function renderWatchInfo(v){
  const owner=v.is_owner;
  const meta=[dims(v), v.captions_url?('CC '+(v.spoken_language||'').toUpperCase()):'', fmtDur(v.duration_sec), fmtBytes(v.bytes)].filter(Boolean).join('  ·  ');
  const visBtn = owner
    ? `<button class="pill ${v.visibility==='public'?'on':''}" onclick="toggleVis('${v.id}','${v.visibility}')">${v.visibility==='public'?'🌐 Public':'🔒 Private'}</button>`
    : `<span class="pill">${v.visibility==='public'?'🌐 Public':''}</span>`;
  let ai='';
  if(v.ai_summary) ai+=`<div class="sum">${esc(v.ai_summary)}</div>`;
  if(v.ai_tags&&v.ai_tags.length) ai+=`<div class="tags">${v.ai_tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
  let chapters='';
  if(v.ai_chapters&&v.ai_chapters.length) chapters=`<div class="chapters"><h4>Chapters</h4>`+
    v.ai_chapters.map(c=>`<div class="chap" onclick="seekTo(${Number(c.start)||0})"><span class="t">${fmtDur(c.start)}</span><span>${esc(c.title||'')}</span></div>`).join('')+`</div>`;
  const info=$('#winfo');
  const likeBtn = `<button class="pill ${v.liked?'on':''}" id="likebtn" onclick="toggleLike('${v.id}')">👍 <span id="likecount">${fmtCount(v.likes||0)}</span></button>`;
  const ch=v.channel;
  const subCount = ch&&ch.subscriber_count!=null ? `${fmtCount(ch.subscriber_count)} subscriber${ch.subscriber_count===1?'':'s'}` : '';
  const chRow = ch ? `<div class="wchanrow">
      <div class="wchan" onclick="go('channel=${esc(ch.handle)}')">
        ${avatarEl(ch,'av')}<div><div class="wcname">${esc(ch.display_name)}</div>
        <div class="wchandle">@${esc(ch.handle)}${subCount?' · '+subCount:''}</div></div></div>
      ${subBtn(ch,'wsub-btn')}</div>` : '';
  info.innerHTML = `<h1 class="wt">${esc(titleOf(v))}</h1>
    ${chRow}
    <div class="wactions">
      ${likeBtn}
      <button class="pill" onclick="openSave('${v.id}')">➕ Save</button>
      ${visBtn}
      <button class="pill" onclick="share('${v.id}',${v.visibility==='public'})">🔗 Share</button>
      ${owner?`<button class="pill" onclick="copyLink('${v.id}')">Copy link</button>`:''}
      <div class="spacer"></div>
    </div>
    <div class="desc"><div class="dmeta">${fmtViews(v.view_count)}${esc(ago(v.created_at))}${meta?'  ·  '+esc(meta):''}</div>${ai||'<span class="hint">No description yet.</span>'}${chapters}</div>
    <div id="trbox"></div>
    <div id="comments" class="comments"></div>`;
  if(v.transcript_status==='ready') loadTranscript(v.id);
  loadComments(v);
}

/* ---------------- comments (P5) ---------------- */
async function loadComments(v){
  const box=$('#comments'); if(!box) return;
  let data=null;
  try{ const r=await fetch('/api/videos/'+v.id+'/comments',{headers:hdr()}); if(r.ok) data=await r.json(); }catch(e){}
  if(!data){ box.innerHTML=''; return; }
  const composer = data.can_comment
    ? `<div class="cmprow"><div class="av letter">${esc(((MYCH&&(MYCH.display_name||MYCH.handle))||'M')[0].toUpperCase())}</div>
        <div class="cmpin"><input id="cmp-input" placeholder="Add a comment…" maxlength="2000"
          onkeydown="if(event.key==='Enter')postComment('${v.id}',null,'cmp-input')">
        <button class="btn primary" onclick="postComment('${v.id}',null,'cmp-input')">Comment</button></div></div>`
    : (TOKEN? '' : `<div class="hint" style="margin:8px 0 16px">Sign in to join the conversation.</div>`);
  box.innerHTML = `<div class="cmhead">${data.count} Comment${data.count===1?'':'s'}</div>
    ${composer}
    <div id="cmlist">${data.comments.map(c=>commentHtml(c, v.id, data.is_owner)).join('')||'<div class="hint">No comments yet — be the first.</div>'}</div>`;
}
function commentHtml(c, videoId, isOwner){
  const a=c.author||{};
  const heart = c.hearted ? `<span class="cheart" title="Hearted by the creator">❤</span>` : '';
  const heartBtn = isOwner ? `<button class="cmaction ${c.hearted?'on':''}" onclick="toggleHeart('${c.id}','${videoId}',${!c.hearted})" title="Heart">❤</button>` : '';
  const delBtn = c.can_delete ? `<button class="cmaction" onclick="deleteComment('${c.id}','${videoId}')" title="Delete">🗑</button>` : '';
  const replies = (c.replies&&c.replies.length)
    ? `<div class="creplies">${c.replies.map(rc=>commentHtml(rc, videoId, isOwner)).join('')}</div>` : '';
  const isReply = !!c.parent_id;
  return `<div class="cmt" data-cid="${c.id}">
    <div class="av letter" onclick="${a.handle?`go('channel=${esc(a.handle)}')`:''}">${esc((a.display_name||a.handle||'?')[0].toUpperCase())}</div>
    <div class="cmbody">
      <div class="cmmeta"><span class="cmname" onclick="${a.handle?`go('channel=${esc(a.handle)}')`:''}">${esc(a.display_name||('@'+a.handle))}</span>
        <span class="cmago">${ago(c.created_at)}</span>${heart}</div>
      <div class="cmtext">${esc(c.body)}</div>
      <div class="cmbar">
        <button class="cmaction ${c.liked?'on':''}" id="clike-${c.id}" onclick="toggleCommentLike('${c.id}')">👍 <span id="clc-${c.id}">${c.like_count||''}</span></button>
        ${isReply?'':`<button class="cmaction" onclick="showReply('${c.id}','${videoId}')">Reply</button>`}
        ${heartBtn}${delBtn}
      </div>
      <div id="reply-${c.id}"></div>
      ${replies}
    </div></div>`;
}
async function postComment(videoId, parentId, inputId){
  if(!TOKEN){ startOAuth(); return; }
  const inp=document.getElementById(inputId); if(!inp) return;
  const body=inp.value.trim(); if(!body) return;
  try{
    const payload={body}; if(parentId) payload.parent_id=parentId;
    const r=await afetch('/api/videos/'+videoId+'/comments',{method:'POST',headers:hdr({'Content-Type':'application/json'}),body:JSON.stringify(payload)});
    if(!r.ok){ toast('Could not post'); return; }
    inp.value=''; const cur=await fetchVideo(videoId); if(cur) loadComments(cur); toast('Posted');
  }catch(e){ toast('Network error'); }
}
function showReply(cid, videoId){
  const box=document.getElementById('reply-'+cid); if(!box) return;
  if(box.dataset.open){ box.innerHTML=''; box.dataset.open=''; return; }
  box.dataset.open='1';
  box.innerHTML=`<div class="cmpin" style="margin-top:8px"><input id="rin-${cid}" placeholder="Add a reply…" maxlength="2000"
      onkeydown="if(event.key==='Enter')postComment('${videoId}','${cid}','rin-${cid}')">
    <button class="btn primary" onclick="postComment('${videoId}','${cid}','rin-${cid}')">Reply</button></div>`;
  const el=document.getElementById('rin-'+cid); if(el) el.focus();
}
async function toggleCommentLike(cid){
  if(!TOKEN){ startOAuth(); return; }
  const btn=document.getElementById('clike-'+cid); if(!btn) return;
  const on=btn.classList.contains('on');
  try{ const r=await afetch('/api/comments/'+cid+'/like',{method:on?'DELETE':'POST'});
    const d=await r.json(); if(r.ok){ btn.classList.toggle('on', d.liked); const c=document.getElementById('clc-'+cid); if(c) c.textContent=d.like_count||''; } }catch(e){}
}
async function toggleHeart(cid, videoId, on){
  try{ const r=await afetch('/api/comments/'+cid+'/heart',{method:on?'POST':'DELETE'});
    if(r.ok){ const cur=await fetchVideo(videoId); if(cur) loadComments(cur); } }catch(e){}
}
async function deleteComment(cid, videoId){
  if(!confirm('Delete this comment?')) return;
  try{ const r=await afetch('/api/comments/'+cid,{method:'DELETE'});
    if(r.ok){ const cur=await fetchVideo(videoId); if(cur) loadComments(cur); toast('Deleted'); } }catch(e){}
}
async function loadTranscript(id){
  try{
    const r = TOKEN ? await afetch('/api/videos/'+id+'/transcript') : null;
    if(!r || !r.ok) return;
    const t=await r.json();
    if(!t.segments || !t.segments.length) return;
    $('#trbox').innerHTML = `<details class="box"><summary>Transcript · ${t.language?t.language.toUpperCase():''} · ${t.word_count||''} words</summary>
      <div class="tr">${t.segments.map(s=>`<div class="seg" onclick="seekTo(${Number(s.start)||0})"><span class="t">${fmtDur(s.start)}</span><span class="x">${esc(s.text)}</span></div>`).join('')}</div></details>`;
  }catch(e){}
}

async function renderUpNext(cur){

/* ---------------- Sign in with MikeOS — OAuth Auth Code + PKCE ---------------- */
function modal(html){ const d=document.createElement('div'); d.className='modal'; d.innerHTML=`<div class="sheet">${html}</div>`;
  d.addEventListener('click',e=>{ if(e.target===d) d.remove(); }); document.body.appendChild(d); return d; }
function _b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function _rand(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return _b64url(a.buffer); }
async function _s256(str){ const d=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return _b64url(d); }
async function startOAuth(){
  const verifier=_rand(48), state=_rand(16);
  sessionStorage.setItem('pkce_v',verifier); sessionStorage.setItem('pkce_s',state);
  const u=new URL(OAUTH.issuer+'/oauth/authorize');
  u.searchParams.set('response_type','code'); u.searchParams.set('client_id',OAUTH.client);
  u.searchParams.set('redirect_uri',OAUTH.redirect); u.searchParams.set('scope',OAUTH.scope);
  u.searchParams.set('state',state);
  u.searchParams.set('code_challenge', await _s256(verifier)); u.searchParams.set('code_challenge_method','S256');
  location.href=u.toString();     // full-page redirect to account.osmike.com
}
function setTokens(d){
  TOKEN=d.access_token; if(d.refresh_token) REFRESH=d.refresh_token;
  localStorage.setItem('mikevideo_token',TOKEN); if(REFRESH) localStorage.setItem('mikevideo_refresh',REFRESH);
  try{ const claims=JSON.parse(atob((d.id_token||TOKEN).split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(claims.email){ USER={email:claims.email}; localStorage.setItem('mikevideo_user',JSON.stringify(USER)); } }catch(e){}
}
async function tryRefresh(){
  if(!REFRESH) return false;
  try{ const r=await fetch('/api/oauth/token',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({grant_type:'refresh_token',refresh_token:REFRESH,client_id:OAUTH.client})});
    const d=await r.json(); if(r.ok && d.access_token){ setTokens(d); return true; } }catch(e){}
  return false;
}
// Authed fetch that transparently refreshes the token once on a 401.
async function afetch(url, opts){
  opts=opts||{}; let r=await fetch(url, Object.assign({}, opts, {headers:hdr(opts.headers||{})}));
  if(r.status===401 && TOKEN && await tryRefresh()){ r=await fetch(url, Object.assign({}, opts, {headers:hdr(opts.headers||{})})); }
  return r;
}
async function handleCallback(){
  const q=new URLSearchParams(location.search);
  const code=q.get('code'), state=q.get('state'), err=q.get('error');
  const v=sessionStorage.getItem('pkce_v'), s=sessionStorage.getItem('pkce_s');
  sessionStorage.removeItem('pkce_v'); sessionStorage.removeItem('pkce_s');
  history.replaceState({},'', '/');
  if(err || !code || !state || state!==s || !v){ renderAccount(); route(); if(err) toast('Sign-in cancelled'); return; }
  try{
    const r=await fetch('/api/oauth/token',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({grant_type:'authorization_code',code,code_verifier:v,client_id:OAUTH.client,redirect_uri:OAUTH.redirect})});
    const d=await r.json();
    if(!r.ok || !d.access_token){ renderAccount(); route(); toast('Sign-in failed'); return; }
    setTokens(d); toast('Signed in'); await loadMyChannel();
  }catch(e){ toast('Sign-in failed'); }
  renderAccount(); go(''); route();
}

// Streaming SHA-256 (never holds the whole file in RAM).
const SHA256=(function(){const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function rotr(n,x){return (x>>>n)|(x<<(32-n));}
function create(){let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];let len=0;let buf=new Uint8Array(0);const w=new Int32Array(64);
function block(p,off){for(let i=0;i<16;i++)w[i]=(p[off+i*4]<<24)|(p[off+i*4+1]<<16)|(p[off+i*4+2]<<8)|(p[off+i*4+3]);
for(let i=16;i<64;i++){const s0=rotr(7,w[i-15])^rotr(18,w[i-15])^(w[i-15]>>>3);const s1=rotr(17,w[i-2])^rotr(19,w[i-2])^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
let[a,b,c,d,e,f,g,hh]=h;for(let i=0;i<64;i++){const S1=rotr(6,e)^rotr(11,e)^rotr(25,e);const ch=(e&f)^(~e&g);const t1=(hh+S1+ch+K[i]+w[i])|0;const S0=rotr(2,a)^rotr(13,a)^rotr(22,a);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;}
return{update(chunk){len+=chunk.length;let data=buf.length?((()=>{const m=new Uint8Array(buf.length+chunk.length);m.set(buf);m.set(chunk,buf.length);return m;})()):chunk;let off=0;while(data.length-off>=64){block(data,off);off+=64;}buf=data.slice(off);},
hex(){const bitLen=len*8;const pad=[];pad.push(0x80);let rem=(buf.length+1)%64;let padLen=(rem<=56?56-rem:120-rem);for(let i=0;i<padLen;i++)pad.push(0);const hi=Math.floor(bitLen/0x100000000),lo=bitLen>>>0;pad.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255);pad.push((lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);const tail=new Uint8Array(buf.length+pad.length);tail.set(buf);tail.set(pad,buf.length);for(let off=0;off<tail.length;off+=64)block(tail,off);return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');}};}

async function sha256hex(buf){const d=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function readSlice(file,start,end){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=()=>rej(r.error);r.readAsArrayBuffer(file.slice(start,end));});}
async function buildManifest(file,uploadId){const total=file.size;const count=Math.ceil(total/CHUNK)||1;const chunks={};const whole=SHA256.create();
for(let i=0;i<count;i++){const start=i*CHUNK,end=Math.min(start+CHUNK,total);const bytes=await readSlice(file,start,end);chunks[String(i)]='sha256:'+await sha256hex(bytes.buffer);whole.update(bytes);}
return{upload_id:uploadId,filename:file.name,content_type:file.type||'video/mp4',total_size:total,chunk_size:CHUNK,count,chunk_hash_algo:'sha256',file_hash:'sha256:'+whole.hex(),chunks};}
async function uploadFile(file, box){
  const el=document.createElement('div'); el.className='up-item';
  el.innerHTML=`<div><b>${esc(file.name)}</b> <span class="hint" data-s>hashing…</span></div><div class="bar"><i></i></div>`;
  box.prepend(el);
  const bar=el.querySelector('i'), stat=el.querySelector('[data-s]');
  const set=(p,t)=>{bar.style.width=(p*100).toFixed(1)+'%'; if(t)stat.textContent=t;};
  try{
    set(0,'hashing…');
    const tmp=await buildManifest(file,'pending');
    set(0.05,'requesting ticket…');
    const cr=await fetch('/api/videos',{method:'POST',headers:hdr({'Content-Type':'application/json'}),
      body:JSON.stringify({filename:file.name,content_type:tmp.content_type,total_size:tmp.total_size,file_hash:tmp.file_hash,chunk_size:CHUNK,count:tmp.count})});
    if(!cr.ok) throw new Error('ticket '+cr.status);
    const tk=await cr.json(); const manifest=Object.assign({},tmp,{upload_id:tk.upload_id});
    set(0.08,'init…');
    const ir=await fetch(tk.ingest_url+'/ingest/init',{method:'POST',headers:{'Authorization':'Bearer '+tk.ticket,'Content-Type':'application/json'},body:JSON.stringify(manifest)});
    if(!ir.ok) throw new Error('init '+ir.status);
    const sr=await fetch(tk.ingest_url+'/ingest/'+manifest.upload_id+'/status',{headers:{'Authorization':'Bearer '+tk.ticket}});
    let missing=(await sr.json()).missing.slice(); const totalC=manifest.count; let done=totalC-missing.length;
    const PAR=3; let idx=0;
    async function worker(){ while(idx<missing.length){ const i=missing[idx++]; const start=i*CHUNK,end=Math.min(start+CHUNK,manifest.total_size); const bytes=await readSlice(file,start,end);
      let ok=false; for(let a=0;a<3&&!ok;a++){ const r=await fetch(tk.ingest_url+'/ingest/'+manifest.upload_id+'/chunk/'+i,{method:'PUT',headers:{'Authorization':'Bearer '+tk.ticket,'Content-Type':'application/octet-stream'},body:bytes}); if(r.ok)ok=true; else if(r.status===422) throw new Error('chunk '+i+' 422'); }
      if(!ok) throw new Error('chunk '+i+' failed'); done++; set(done/totalC,'uploading '+done+'/'+totalC); } }
    await Promise.all(Array.from({length:PAR},worker));
    set(0.99,'finalizing…');
    const fr=await fetch(tk.ingest_url+'/ingest/'+manifest.upload_id+'/finalize',{method:'POST',headers:{'Authorization':'Bearer '+tk.ticket}});
    const fb=await fr.json(); if(!fr.ok||!fb.complete) throw new Error('finalize');
    set(1,'done — encoding…'); toast('Uploaded — encoding now');
    setTimeout(()=>el.remove(),4000);
    if(parseHash().v==='home') renderHome();
  }catch(e){ stat.textContent='failed: '+e.message; el.style.borderColor='var(--err)'; console.error(e); }
}

/* ---------------- boot ---------------- */
if(location.pathname==='/auth/callback'){ handleCallback(); }
else { renderAccount(); route(); if(TOKEN) loadMyChannel().then(renderAccount); }
// live-refresh the home grid so encoding→ready + new transcripts/titles surface
setInterval(()=>{ if(parseHash().v==='home' && TOKEN){ loadLibrary().then(v=>{ if(_home==='mine' && parseHash().v==='home'){ const g=$('#grid'); if(g) g.innerHTML = v.length? v.map(videoCard).join('') : g.innerHTML; } }); } }, 9000);
</script>
