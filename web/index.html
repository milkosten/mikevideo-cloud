<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MikeVideo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23FF8A5B'/%3E%3Cstop offset='.5' stop-color='%23FF6FA5'/%3E%3Cstop offset='1' stop-color='%237C7CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%23131017'/%3E%3Cpath d='M13 11l9 5-9 5z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131017; --bg2:#1b1723; --card:#201b29; --line:#2e2839;
    --ink:#f5f0ea; --muted:#a79db4; --faint:#7c7389;
    --coral:#FF8A5B; --rose:#FF6FA5; --peri:#7C7CFF; --sky:#4FC4E8;
    --ok:#5fd39a; --warn:#ffcf5c; --err:#ff7a7a;
    --grad:linear-gradient(100deg,var(--coral),var(--rose) 45%,var(--peri) 86%);
    --radius:16px;
    --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --disp:"Fraunces",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);min-height:100vh;background:var(--bg);
    -webkit-font-smoothing:antialiased;font-size:15.5px;line-height:1.55}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(900px 480px at 82% -8%, rgba(255,111,165,.16), transparent 60%),
      radial-gradient(760px 420px at 6% -6%, rgba(255,138,91,.14), transparent 60%),
      radial-gradient(760px 520px at 60% 112%, rgba(124,124,255,.12), transparent 60%)}
  .app{position:relative;z-index:1}
  a{color:var(--rose);text-decoration:none}
  input,button{font:inherit}

  header{display:flex;align-items:center;gap:14px;padding:16px 24px;position:sticky;top:0;z-index:20;
    border-bottom:1px solid var(--line);background:rgba(19,16,23,.72);backdrop-filter:blur(14px)}
  .logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.01em}
  .logo .mark{width:27px;height:27px;border-radius:8px;background:var(--grad);display:grid;place-items:center;
    color:#fff;font-size:12px;box-shadow:0 6px 18px -6px rgba(255,111,165,.6)}
  .logo .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .spacer{flex:1}
  .keyfield{display:flex;gap:8px;align-items:center}
  .keyfield .dot{width:9px;height:9px;border-radius:50%;background:#4a4356;flex:none;transition:.3s}
  .keyfield.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(95,211,154,.16)}
  input[type=password],input[type=text]{background:var(--bg2);border:1px solid var(--line);color:var(--ink);
    padding:9px 13px;border-radius:11px;min-width:210px;outline:none;transition:.15s}
  input:focus{border-color:var(--peri);box-shadow:0 0 0 3px rgba(124,124,255,.18)}
  input::placeholder{color:var(--faint)}
  button{background:var(--grad);color:#fff;border:none;padding:10px 18px;border-radius:11px;font-weight:700;
    cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 10px 24px -12px rgba(255,111,165,.6)}
  button:hover{transform:translateY(-1px)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600;box-shadow:none}
  button.ghost:hover{border-color:var(--peri);color:#fff}
  button:disabled{opacity:.5;cursor:default;transform:none}

  main{max-width:1140px;margin:0 auto;padding:30px 24px 80px}

  .drop{position:relative;border:1.5px dashed var(--line);border-radius:22px;padding:44px 30px;text-align:center;
    color:var(--muted);background:linear-gradient(180deg,var(--bg2),rgba(27,23,35,.35));transition:.18s;
    margin-bottom:26px;cursor:pointer;overflow:hidden}
  .drop:hover{border-color:var(--peri);color:var(--ink)}
  .drop.hot{border-color:var(--rose);color:var(--ink);background:rgba(255,111,165,.06)}
  .drop .up-ic{width:52px;height:52px;border-radius:15px;background:var(--grad);margin:0 auto 16px;display:grid;
    place-items:center;color:#fff;font-size:24px;box-shadow:0 14px 30px -12px rgba(255,138,91,.6)}
  .drop .big{font-family:var(--disp);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:6px;letter-spacing:-.01em}
  .drop b{color:var(--rose);font-weight:600}
  .drop small{color:var(--faint);font-size:13px;display:block;max-width:44ch;margin:0 auto}

  #uploads .up{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:11px}
  #uploads .up b{font-weight:600}
  .bar{height:8px;background:#151119;border-radius:6px;overflow:hidden;margin-top:9px}
  .bar>i{display:block;height:100%;width:0;background:var(--grad);border-radius:6px;transition:width .25s}
  .hint{color:var(--muted);font-size:12.5px}

  .sec-head{display:flex;align-items:baseline;gap:12px;margin:6px 0 18px}
  h2{font-family:var(--disp);font-weight:400;font-size:26px;letter-spacing:-.02em;margin:0}
  .count{color:var(--faint);font-size:14px;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
  .card:hover{transform:translateY(-4px);border-color:#3c3550;box-shadow:0 24px 44px -28px rgba(0,0,0,.85)}
  .thumb{position:relative;aspect-ratio:16/9;background:#0f0b13 center/cover no-repeat;display:flex;
    align-items:center;justify-content:center}
  .thumb.portrait{background-size:contain;background-color:#0b0810}
  .thumb .ph{color:#4a4356;font-size:30px}
  .thumb::after{content:"\25B6";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#fff;background:rgba(15,11,19,.42);opacity:0;transition:.18s}
  .card:hover .thumb::after{opacity:1}
  .badge{position:absolute;right:8px;bottom:8px;background:rgba(6,4,9,.82);color:#fff;font-size:11px;
    font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em;line-height:1.5}
  .otag{position:absolute;left:8px;top:8px;background:rgba(6,4,9,.72);color:var(--muted);font-size:10px;
    font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
  .meta{padding:13px 14px 15px}
  .title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{color:var(--muted);font-size:12.5px;margin-top:8px;display:flex;gap:9px;align-items:center}
  .chip{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;text-transform:capitalize;letter-spacing:.02em}
  .chip.ready{background:rgba(95,211,154,.15);color:var(--ok)}
  .chip.encoding{background:rgba(255,207,92,.15);color:var(--warn);animation:pulse 1.6s ease-in-out infinite}
  .chip.uploading{background:rgba(255,138,91,.16);color:var(--coral)}
  .chip.failed{background:rgba(255,122,122,.16);color:var(--err)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .empty{color:var(--muted);padding:56px 20px;text-align:center;border:1px dashed var(--line);
    border-radius:var(--radius);background:var(--bg2)}

  #watch{position:fixed;inset:0;background:#0a0709;z-index:50;display:none;flex-direction:column}
  #watch.on{display:flex}
  .wbar{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);
    background:rgba(10,7,9,.82);backdrop-filter:blur(8px)}
  #wtitle{font-family:var(--disp);font-weight:400;font-size:18px;letter-spacing:-.01em}
  #player{flex:1;min-height:0;width:100%;background:#000;display:grid;place-items:center;overflow:hidden}
  /* Show the WHOLE frame at its natural aspect (portrait or landscape), centered,
     never overflowing — bulletproof for any geometry now the backend is correct. */
  video{max-width:100%;max-height:100%;width:auto;height:auto;background:#000;display:block}
  #wmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  #wmeta .m{font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);
    padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap}

  @media(max-width:640px){
    header{flex-wrap:wrap;gap:10px;padding:14px 16px}
    .keyfield{width:100%}
    input[type=password],input[type=text]{flex:1;min-width:0}
    main{padding:22px 16px 60px}
    .drop{padding:34px 20px}
  }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><span class="mark">▶</span>Mike<span class="grad-text">Video</span></div>
  <div class="spacer"></div>
  <div class="keyfield" id="keyfield">
    <span class="dot"></span>
    <input id="apikey" type="password" placeholder="paste your X-API-KEY" autocomplete="off">
    <button class="ghost" id="savekey">Connect</button>
  </div>
</header>

<main>
  <div class="drop" id="drop">
    <div class="up-ic">↑</div>
    <div class="big"><b>Drop a video</b> to share it</div>
    <input type="file" id="file" accept="video/*" style="display:none">
    <small>Or click to choose — it uploads in chunks, so even big files never overload your device.</small>
  </div>
  <div id="uploads"></div>

  <div class="sec-head"><h2>Your library</h2><span class="count" id="count"></span></div>
  <div id="lib" class="grid"></div>
  <div id="libempty" class="empty" style="display:none">No videos yet. Drop one above to get started.</div>
</main>

<div id="watch">
  <div class="wbar">
    <button class="ghost" id="back">← Library</button>
    <div id="wtitle"></div>
    <div class="spacer"></div>
    <div id="wmeta"></div>
  </div>
  <div id="player"></div>
</div>
</div>

<script src="/hls.js"></script>
<script>
const CHUNK = 4 * 1024 * 1024;            // 4 MiB chunks (<= ingest MAX_CHUNK_SIZE 8 MiB)
let API_KEY = localStorage.getItem('mikevideo_key') || '';
document.getElementById('apikey').value = API_KEY;

function hdr(extra){ const h = Object.assign({'X-API-KEY':API_KEY}, extra||{}); return h; }
function fmtDur(s){ if(!s) return ''; s=Math.round(s); const h=(s/3600)|0, m=((s%3600)/60)|0, ss=('0'+(s%60)).slice(-2);
  return h ? (h+':'+('0'+m).slice(-2)+':'+ss) : (m+':'+ss); }
function fmtBytes(b){ if(!b) return ''; const u=['B','KB','MB','GB','TB']; let i=0; b=+b;
  while(b>=1024&&i<u.length-1){b/=1024;i++;} return (b>=100||i===0?Math.round(b):b.toFixed(1))+' '+u[i]; }
function dispDims(v){ const w=v.display_width||v.width, h=v.display_height||v.height; return (w&&h)?(w+'×'+h):''; }

document.getElementById('savekey').onclick = ()=>{
  API_KEY = document.getElementById('apikey').value.trim();
  localStorage.setItem('mikevideo_key', API_KEY);
  loadLibrary();
};

// ---- WebCrypto sha256 helpers ----
async function sha256hex(buf){
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Streaming whole-file sha256 is not in WebCrypto; we accumulate per-chunk into
// a running digest is impossible, so we hash the whole file by feeding a growing
// buffer is disallowed by the memory rule. Instead we compute the whole-file
// hash incrementally with a JS sha256 fallback only if needed. Here we hash the
// whole file with crypto.subtle over a single ArrayBuffer ONLY for small files;
// for larger, we chain chunk digests. To honour the memory rule AND get a real
// whole-file sha256, we use a streaming JS implementation below.

// Minimal streaming SHA-256 (so we never hold the whole file in RAM).
const SHA256 = (function(){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  function rotr(n,x){return (x>>>n)|(x<<(32-n));}
  function create(){
    let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    let len=0; let buf=new Uint8Array(0);
    const w=new Int32Array(64);
    function block(p,off){
      for(let i=0;i<16;i++) w[i]=(p[off+i*4]<<24)|(p[off+i*4+1]<<16)|(p[off+i*4+2]<<8)|(p[off+i*4+3]);
      for(let i=16;i<64;i++){
        const s0=rotr(7,w[i-15])^rotr(18,w[i-15])^(w[i-15]>>>3);
        const s1=rotr(17,w[i-2])^rotr(19,w[i-2])^(w[i-2]>>>10);
        w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
      }
      let[a,b,c,d,e,f,g,hh]=h;
      for(let i=0;i<64;i++){
        const S1=rotr(6,e)^rotr(11,e)^rotr(25,e);
        const ch=(e&f)^(~e&g);
        const t1=(hh+S1+ch+K[i]+w[i])|0;
        const S0=rotr(2,a)^rotr(13,a)^rotr(22,a);
        const maj=(a&b)^(a&c)^(b&c);
        const t2=(S0+maj)|0;
        hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;
      h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
    }
    return {
      update(chunk){
        len+=chunk.length;
        let data=buf.length?((()=>{const m=new Uint8Array(buf.length+chunk.length);m.set(buf);m.set(chunk,buf.length);return m;})()):chunk;
        let off=0;
        while(data.length-off>=64){ block(data,off); off+=64; }
        buf=data.slice(off);
      },
      hex(){
        const bitLen=len*8;
        const pad=[]; pad.push(0x80);
        let rem=(buf.length+1)%64;
        let padLen=(rem<=56?56-rem:120-rem);
        for(let i=0;i<padLen;i++) pad.push(0);
        const hi=Math.floor(bitLen/0x100000000), lo=bitLen>>>0;
        pad.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255);
        pad.push((lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
        const tail=new Uint8Array(buf.length+pad.length);
        tail.set(buf); tail.set(pad,buf.length);
        for(let off=0;off<tail.length;off+=64) block(tail,off);
        return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
      }
    };
  }
  return {create};
})();

function readSlice(file, start, end){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(new Uint8Array(r.result));
    r.onerror=()=>rej(r.error);
    r.readAsArrayBuffer(file.slice(start,end));
  });
}

async function buildManifest(file, uploadId){
  const total=file.size;
  const count=Math.ceil(total/CHUNK) || 1;
  const chunks={};
  const whole=SHA256.create();
  for(let i=0;i<count;i++){
    const start=i*CHUNK, end=Math.min(start+CHUNK,total);
    const bytes=await readSlice(file,start,end);   // one chunk in RAM at a time
    chunks[String(i)]='sha256:'+await sha256hex(bytes.buffer);
    whole.update(bytes);
  }
  return {
    upload_id: uploadId,
    filename: file.name,
    content_type: file.type||'video/mp4',
    total_size: total,
    chunk_size: CHUNK,
    count: count,
    chunk_hash_algo: 'sha256',
    file_hash: 'sha256:'+whole.hex(),
    chunks: chunks
  };
}

async function uploadFile(file){
  if(!API_KEY){ alert('Paste your X-API-KEY first.'); return; }
  const box=document.getElementById('uploads');
  const el=document.createElement('div'); el.className='up';
  el.innerHTML=`<div><b>${file.name}</b> <span class="hint" data-s>hashing…</span></div>
    <div class="bar"><i></i></div>`;
  box.prepend(el);
  const bar=el.querySelector('i'), stat=el.querySelector('[data-s]');
  const set=(p,t)=>{bar.style.width=(p*100).toFixed(1)+'%'; if(t)stat.textContent=t;};

  try{
    // 1. ask cloud for a ticket — but we need file_hash first, so build manifest.
    // We build a tiny manifest with a placeholder to get upload_id? No: cloud
    // issues upload_id. So: build manifest with our own hash, POST /api/videos
    // (cloud returns its upload_id), then re-key the manifest to that upload_id.
    set(0,'hashing (sha256, streamed)…');
    const tmpManifest=await buildManifest(file,'pending');
    set(0.05,'requesting ticket…');
    const cr=await fetch('/api/videos',{method:'POST',headers:hdr({'Content-Type':'application/json'}),
      body:JSON.stringify({filename:file.name,content_type:tmpManifest.content_type,
        total_size:tmpManifest.total_size,file_hash:tmpManifest.file_hash,
        chunk_size:CHUNK,count:tmpManifest.count})});
    if(!cr.ok){ throw new Error('ticket '+cr.status+' '+await cr.text()); }
    const tk=await cr.json();
    const manifest=Object.assign({},tmpManifest,{upload_id:tk.upload_id});
    const ingest=tk.ingest_url, ticket=tk.ticket;

    // 2. init
    set(0.08,'init…');
    const ir=await fetch(ingest+'/ingest/init',{method:'POST',
      headers:{'Authorization':'Bearer '+ticket,'Content-Type':'application/json'},
      body:JSON.stringify(manifest)});
    if(!ir.ok){ throw new Error('init '+ir.status+' '+await ir.text()); }
    let init=await ir.json();

    // 3. resume-aware: fetch status, send only missing
    const sr=await fetch(ingest+'/ingest/'+manifest.upload_id+'/status',
      {headers:{'Authorization':'Bearer '+ticket}});
    const status=await sr.json();
    let missing=status.missing.slice();
    const totalC=manifest.count;
    let done=totalC-missing.length;

    // 4. send missing chunks (small parallelism)
    const PAR=3; let idx=0;
    async function worker(){
      while(idx<missing.length){
        const i=missing[idx++];
        const start=i*CHUNK, end=Math.min(start+CHUNK,manifest.total_size);
        const bytes=await readSlice(file,start,end);
        let ok=false;
        for(let attempt=0;attempt<3&&!ok;attempt++){
          const r=await fetch(ingest+'/ingest/'+manifest.upload_id+'/chunk/'+i,
            {method:'PUT',headers:{'Authorization':'Bearer '+ticket,
              'Content-Type':'application/octet-stream'},body:bytes});
          if(r.ok){ok=true;} else if(r.status===422){ throw new Error('chunk '+i+' rejected 422'); }
        }
        if(!ok) throw new Error('chunk '+i+' failed after retries');
        done++; set(done/totalC,'uploading '+done+'/'+totalC);
      }
    }
    await Promise.all(Array.from({length:PAR},worker));

    // 5. finalize
    set(0.99,'finalizing…');
    const fr=await fetch(ingest+'/ingest/'+manifest.upload_id+'/finalize',
      {method:'POST',headers:{'Authorization':'Bearer '+ticket}});
    const fbody=await fr.json();
    if(!fr.ok || !fbody.complete){ throw new Error('finalize: '+JSON.stringify(fbody)); }
    set(1,'done — encoding…');
    setTimeout(()=>{el.remove();},4000);
    loadLibrary();
  }catch(e){
    stat.textContent='failed: '+e.message; el.style.borderColor='#ff5a5a';
    console.error(e);
  }
}

// ---- library ----
async function loadLibrary(){
  const lib=document.getElementById('lib'), empty=document.getElementById('libempty');
  if(!API_KEY){ lib.innerHTML=''; empty.style.display='block'; empty.textContent='Paste your X-API-KEY to see your library.'; return; }
  try{
    const r=await fetch('/api/videos',{headers:hdr()});
    if(!r.ok){ lib.innerHTML=''; empty.style.display='block'; empty.textContent='Auth failed ('+r.status+').'; return; }
    const {videos}=await r.json();
    lib.innerHTML='';
    if(!videos.length){ empty.style.display='block'; empty.textContent='No videos yet. Drop one above to get started.'; return; }
    empty.style.display='none';
    for(const v of videos){
      const c=document.createElement('div'); c.className='card';
      const portrait = v.orientation==='portrait';
      const thumbStyle=v.thumb_url?`style="background-image:url('${v.thumb_url}')"`:'';
      const dur=v.duration_sec?`<span class="badge">${fmtDur(v.duration_sec)}</span>`:'';
      const dims=dispDims(v); const otag=dims?`<span class="otag">${dims}</span>`:'';
      c.innerHTML=`<div class="thumb ${portrait?'portrait':''}" ${thumbStyle}>
          ${v.thumb_url?'':'<span class="ph">▶</span>'}${v.status==='ready'?otag+dur:''}</div>
        <div class="meta"><div class="title">${v.filename}</div>
        <div class="sub"><span class="chip ${v.status}">${v.status}</span>
        <span>${fmtDur(v.duration_sec)}</span></div></div>`;
      if(v.status==='ready') c.onclick=()=>openWatch(v.id,v.filename);
      lib.appendChild(c);
    }
  }catch(e){ console.error(e); }
}

// ---- watch ----
let hls=null;
async function openWatch(id,title){
  const r=await fetch('/api/videos/'+id,{headers:hdr()});
  if(!r.ok){ alert('cannot open'); return; }
  const v=await r.json();
  document.getElementById('wtitle').textContent=title;
  // Metadata readout: resolution · fps · codec · duration · size.
  const chips=[];
  const dims=dispDims(v); if(dims) chips.push(dims+(v.orientation?' '+v.orientation:''));
  if(v.fps) chips.push(Math.round(v.fps)+' fps');
  if(v.video_codec) chips.push(v.video_codec.toUpperCase()+(v.has_audio&&v.audio_codec?' · '+v.audio_codec.toUpperCase():' · silent'));
  if(v.is_hdr) chips.push('HDR');
  if(v.duration_sec) chips.push(fmtDur(v.duration_sec));
  if(v.bytes) chips.push(fmtBytes(v.bytes));
  document.getElementById('wmeta').innerHTML=chips.map(c=>`<span class="m">${c}</span>`).join('');
  const player=document.getElementById('player'); player.innerHTML='';
  const video=document.createElement('video'); video.controls=true; video.autoplay=true; video.playsInline=true;
  // Hint the natural aspect so the box is correct even before the first frame decodes.
  if(v.display_width&&v.display_height) video.style.aspectRatio=v.display_width+' / '+v.display_height;
  if(v.thumb_url) video.poster=v.thumb_url;
  player.appendChild(video);
  if(hls){hls.destroy();hls=null;}
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=v.hls_url;                        // native HLS (Safari)
  }else if(window.Hls && Hls.isSupported()){
    hls=new Hls({maxBufferLength:20});
    hls.loadSource(v.hls_url); hls.attachMedia(video);
  }else{
    video.src=v.mp4_url;                         // fallback
  }
  document.getElementById('watch').classList.add('on');
}
document.getElementById('back').onclick=()=>{
  document.getElementById('watch').classList.remove('on');
  const p=document.getElementById('player'); p.innerHTML=''; if(hls){hls.destroy();hls=null;}
  loadLibrary();
};

// ---- drop zone wiring ----
const drop=document.getElementById('drop'), fileInput=document.getElementById('file');
drop.onclick=()=>fileInput.click();
fileInput.onchange=()=>{ if(fileInput.files[0]) uploadFile(fileInput.files[0]); fileInput.value=''; };
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) uploadFile(f); });

// poll library so encoding->ready flips live
loadLibrary();
setInterval(loadLibrary, 8000);
</script>
<script>
(function(){
  var kf=document.getElementById('keyfield'),input=document.getElementById('apikey'),
      save=document.getElementById('savekey'),lib=document.getElementById('lib'),
      count=document.getElementById('count');
  function refl(){ kf.classList.toggle('on', !!input.value.trim()); }
  function recount(){ var n=lib.querySelectorAll('.card').length;
    count.textContent = n ? (n+' video'+(n>1?'s':'')) : ''; }
  refl(); save.addEventListener('click',refl); input.addEventListener('input',refl);
  new MutationObserver(recount).observe(lib,{childList:true});
  setInterval(recount, 1000);
})();
</script>
